<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vocula app icon — full size, used for every slice from 64px up
       THE source. Every PNG in AppIcon.appiconset is rendered from this file by
       Tools/GenerateAppIcon.swift; none of them is edited by hand. That is the
       point: ten hand-made PNGs drifted apart in colour and in geometry, and
       nothing could catch it.

       Palette. The neutrals follow Theme.Ink; the mark does NOT — see below:
         orange #FF8100  oklch(0.74 0.20 56)   HOTTER than the product
                token, on purpose. Theme.Ink.fillDark and the site's
                -h:70 / -ca:0.13 stay at #F3AE58; the icon does not. An
                icon competes for attention in a Dock full of other people's
                icons and an interface does not, so the mark is pushed to
                oklch(0.74 0.20 56) — which leaves sRGB and is clipped to the
                gamut edge, deliberately. This is NOT drift from the token.
                Do not "correct" it back.
         white  #FFFFFF                        the ramp's cool end
         plate  #3C3834 -> #181614             the tile
       Geometry is MenuBarMark's 18pt grid, stretched: the mark is wider and
       shorter here, because bars that fight for height in a menu bar read as a
       picket fence on a tile with room. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C3834"/>
      <stop offset="1" stop-color="#181614"/>
    </linearGradient>
    <!-- One ramp across the WHOLE mark, not restarted per bar — restarting it
         would paint five identical bars and the letter would flatten. -->
    <linearGradient id="ramp" gradientUnits="userSpaceOnUse"
                    x1="203.00" y1="0" x2="821.00" y2="0">
      <stop offset="0" stop-color="#FFFFFF" data-token="mark.cool"/>
      <stop offset="1" stop-color="#FF8100" data-token="mark.hot"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14.3" stdDeviation="17.9" flood-color="#000" flood-opacity="0.35"/>
    </filter>

# App/project.yml
name: Vocula
options:
  bundleIdPrefix: app.vocula
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Vocula:
    path: ..
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: bd4b7434e6bdb588c7ef55706ff8904cb7fd4c57
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    revision: c21fdcde390313a6d98d8e33a346f2c3486c3ab0
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    revision: 0bb916c67f4b9e5c682cbe02a42c701c93ab5021
  # Pins only, no product linked: the resolved file lives inside the generated,
  # gitignored Vocula.xcodeproj, so nothing else holds MLX's and
  # swift-transformers' own dependencies to the commits this build was tested with.
  SwiftNumerics:
    url: https://github.com/apple/swift-numerics
    revision: 0c0290ff6b24942dadb83a929ffaaa1481df04a2
  SwiftArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    revision: 6a52f3251125d74daf04fcbd5e6f08a75d074382
  SwiftSyntax:
    url: https://github.com/swiftlang/swift-syntax.git
    revision: 79e4b74a295b6eb74a8b585e3a39d29e70c1dbd1
  SwiftJinja:
    url: https://github.com/huggingface/swift-jinja.git
    revision: 12ea4955e380dae6b0cd98299effe48c7fe584fc
  SwiftHuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    revision: b5403ed09403f674601fd1123e07c5b32914d16f
  SwiftCollections:
    url: https://github.com/apple/swift-collections.git
    revision: a0cb0954ecb21e4e31b0070e6ed5674e8556685a
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    revision: da9d28d69ebe3894b18376c8f2395c2f37b8448f
  SwiftASN1:
    url: https://github.com/apple/swift-asn1.git
    revision: d9a5b37470adc940d22c3bcd5ca6953a516b727f
  YYJSON:
    url: https://github.com/ibireme/yyjson.git
    revision: 8b4a38dc994a110abaec8a400615567bd996105f
  EventSource:
    url: https://github.com/mattt/EventSource.git
    revision: 86b5096ac59ab46e66bd1f6377c604bc1dab0bc2
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: ac2def288cbff5cfc7df3ffef6abdf45b72bcb0a
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    ARCHS: arm64
targets:
  Vocula:
    type: application
    platform: macOS
    sources:
      - path: Vocula
      - path: ../LICENSE
        buildPhase: resources
    dependencies:
      - package: Vocula
        product: VoculaKit
      - package: Vocula
        product: VoculaWhisper
      - package: Vocula
        product: VoculaParakeet
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - package: Sparkle
        product: Sparkle
    info:
      path: Vocula/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        LSUIElement: true
        NSMicrophoneUsageDescription: >-
          Vocula records audio only while you are dictating.
        SUFeedURL: https://github.com/vitaly-kashtalyan/vocula/releases/latest/download/appcast.xml
        SUPublicEDKey: Ekqc9fb1bo7nWx70S5B0rfaP4w/gUX9i51XPw8tBiL0=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        NSHumanReadableCopyright: >-
          Copyright © 2026 Vitali Kashtalyan. Licensed under the GNU General
          Public License, version 3. Source: github.com/vitaly-kashtalyan/vocula
    postBuildScripts:
      - script: ../scripts/stamp-build-number.sh
        name: Stamp CFBundleVersion from the commit count
        basedOnDependencyAnalysis: false
    entitlements:
      path: Vocula/Vocula.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vocula.mac
        ENABLE_HARDENED_RUNTIME: YES
  VoculaAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [VoculaTests]
    dependencies:
      - target: Vocula
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vocula.VoculaTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vocula.app/Contents/MacOS/Vocula"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_HARDENED_RUNTIME: NO
  VoculaUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [VoculaUITests]
    dependencies:
      - target: Vocula
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vocula.VoculaUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Vocula
schemes:
  Vocula:
    build:
      targets:
        Vocula: all
        VoculaAppTests: [test]
        VoculaUITests: [test]
    test:
      targets: [VoculaAppTests, VoculaUITests]
    run:
      config: Debug

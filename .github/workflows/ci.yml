name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '23 5 * * 1'

# A called workflow inherits the caller's token scope, and release.yml calls
# this one under `contents: write`; without this the job holds a token that can
# push to main while running a fork's build phases.
permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27

    steps:
      # Xcode 26 builds a dependency's enabled package trait without its compile
      # condition, so FluidAudio's `#if Diarizer` code compiles empty and the app
      # does not build; 27.2 passes it. The image defaults to 27.1, and a tool a test
      # starts follows xcode-select rather than DEVELOPER_DIR.
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guards
        run: |
          ./scripts/check-purity.sh
          ./scripts/check-localization.sh

      - name: Fetch the models-v1 release
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/releases"
          gh api repos/vitaly-kashtalyan/vocula/releases/tags/models-v1 > "$RUNNER_TEMP/releases/models-v1.json"
          gh api repos/vitaly-kashtalyan/vocula/releases/latest > "$RUNNER_TEMP/releases/latest.json"

      - name: swift test
        env:
          VOCULA_RELEASES: ${{ runner.temp }}/releases
        run: swift test

      # MLX compiles its Metal kernels from source, and Xcode ships that
      # toolchain as a separate component. Without it the build fails at a step
      # that did not exist before MLX, with "cannot execute tool 'metal'".
      - name: Metal Toolchain
        run: |
          xcodebuild -showComponent MetalToolchain | grep -q '^Status: installed' \
            || xcodebuild -downloadComponent MetalToolchain

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Hosted app tests
        run: |
          set -o pipefail
          xcodebuild test \
            -skipPackagePluginValidation \
            -project App/Vocula.xcodeproj \
            -scheme Vocula \
            -only-testing:VoculaAppTests \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  notarize:
    needs: test
    runs-on: macos-26

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.app/Contents/Developer
      VOCULA_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      VOCULA_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0

      - name: Work out the version, and tag it
        run: |
          set -euo pipefail
          LINE=$(grep -E '^ +MARKETING_VERSION:' App/project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')
          SERIES=$(echo "$LINE" | cut -d. -f1,2)
          LATEST=$(git tag -l "v$SERIES.*" \
            | sed -E "s|^v$SERIES\.||" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          VERSION="$SERIES.$(( ${LATEST:--1} + 1 ))"
          echo "VOCULA_MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "▸ releasing $VERSION"

      - name: Refuse a build Sparkle would never offer
        # CFBundleVersion is the commit count, and it CAN GO DOWN when the branch
        # being built changes. Sparkle compares that number and nothing else, so a
        # repeated or lower one means no update is ever offered again, to every
        # installed copy, with no channel left to say so. Cheap here, impossible
        # in the field.
        run: |
          set -euo pipefail
          BUILD=$(git rev-list --count --first-parent HEAD)
          FEED=https://github.com/vitaly-kashtalyan/vocula/releases/latest/download/appcast.xml
          CODE=$(curl -sSL -o "$RUNNER_TEMP/feed.xml" -w '%{http_code}' "$FEED" || echo 000)
          case "$CODE" in
            200) PUBLISHED=$(sed -n 's/.*sparkle:version="\([0-9]*\)".*/\1/p' \
                   "$RUNNER_TEMP/feed.xml" | sort -n | tail -1) ;;
            404) PUBLISHED="" ;;
            *) echo "could not read the live appcast (HTTP $CODE)." >&2
               echo "A network error must not read as 'first release'." >&2
               exit 1 ;;
          esac
          if [ -z "${PUBLISHED:-}" ]; then
            echo "▸ no published appcast yet — first release, nothing to compare"
          elif [ "$BUILD" -le "$PUBLISHED" ]; then
            echo "❌ build $BUILD is not higher than the published $PUBLISHED." >&2
            echo "   Sparkle would offer nothing, for ever, to everyone." >&2
            exit 1
          else
            echo "▸ build $BUILD > published $PUBLISHED"
          fi

      - name: Tools
        # Before the keychain is imported, never after: from then on the signing
        # identity is unlocked and a formula could sign with it. generate_appcast
        # runs WITH the Sparkle signing key in its environment, so it arrives the
        # same way and pinned by checksum rather than by a mutable formula.
        run: |
          set -euo pipefail
          brew install xcodegen
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          echo "52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192  $RUNNER_TEMP/sparkle.tar.xz" \
            | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP" bin/generate_appcast
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          # No -t: the disk image is signed AFTER Apple answers, and a wait past
          # half an hour is not unusual, so an idle timeout locked the keychain
          # before the last codesign of the run — on a runner with nobody to
          # unlock it.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Team, and the notary key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          printf 'DEVELOPMENT_TEAM = %s\n' "$DEVELOPMENT_TEAM" > App/Local.xcconfig

          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "VOCULA_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarise, staple
        run: ./scripts/notarize.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Vocula
          path: |
            build/notarize/Vocula.dmg
            build/notarize/Vocula.zip

      # Release strips the symbols out of the binary and leaves them here. A
      # crash report from a shipped build is unreadable without the dSYM of
      # that exact build, and it cannot be reproduced: the signature carries a
      # nonce. Kept beside the run, not in the release — buyers do not need it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Vocula-symbols
          path: build/notarize/dd/Build/Products/Release/*.dSYM

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUILD=$(git rev-list --count --first-parent HEAD)
          APPCAST="$RUNNER_TEMP/appcast"
          mkdir -p "$APPCAST"
          cp build/notarize/Vocula.zip "$APPCAST/"

          # The changelog alone reaches the in-app update pane. The standing
          # description below it is written for a stranger on a release page and
          # would tell a buyer mid-update to drag a DMG they are not downloading.
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body \
            > "$APPCAST/Vocula.md"
          {
            cat "$APPCAST/Vocula.md"
            printf '\n---\n\n'
            cat Packaging/release-header.md
          } > "$RUNNER_TEMP/notes.md"

          # .md AND --embed-release-notes: generate_appcast picks the format from
          # the extension, and .md alone emits a link to a file nothing uploads.
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | generate_appcast \
            --ed-key-file - \
            --embed-release-notes \
            --link https://vocula.app \
            --download-url-prefix "https://github.com/vitaly-kashtalyan/vocula/releases/download/$TAG/" \
            "$APPCAST"

          # A key mismatch is a WARNING to generate_appcast: it emits an unsigned
          # enclosure and exits 0. Installed copies then fail feed validation, and
          # 20 days later Sparkle stops requiring a feed signature at all.
          FEED_XML="$APPCAST/appcast.xml"
          [ -f "$FEED_XML" ] || { echo "no appcast was generated" >&2; exit 1; }
          grep -q 'sparkle:edSignature=' "$FEED_XML" \
            || { echo "the enclosure is unsigned: wrong or truncated key" >&2; exit 1; }
          grep -q 'sparkle-signatures:' "$FEED_XML" \
            || { echo "the feed itself is unsigned" >&2; exit 1; }
          grep -q "releases/download/$TAG/Vocula.zip" "$FEED_XML" \
            || { echo "the enclosure does not point at this release" >&2; exit 1; }
          grep -q "sparkle:version=\"$BUILD\"" "$FEED_XML" \
            || { echo "the feed advertises a build this run did not make" >&2; exit 1; }

          gh release create "$TAG" \
            build/notarize/Vocula.dmg build/notarize/Vocula.zip "$FEED_XML" \
            --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Shred the credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/signing.keychain-db"
